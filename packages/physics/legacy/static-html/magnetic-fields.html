  key: '<b>F = BIl</b> when the field is perpendicular to the current. The <b>tesla</b> is the flux density that gives a force of 1 N on 1 m of wire carrying 1 A. <b>Fleming’s left-hand rule:</b> First finger = Field, seCond finger = Current, thuMb = Motion (force). In Required practical 10 the magnets sit on a top-pan balance, so the reading changes by F/g.',
  draw(c, w, h, p) {

{ code: '3.7.5.2', name: 'Moving charges', title: 'Charged particles in a magnetic field', sub: 'F = BQv acts at right angles to the velocity, so the path is a circle. The idea behind the cyclotron.', h: 380,
  p: { part: 'e', v: 5, B: 5, fld: -1 }, st: { phase: 0 },
  ctl: [O('part', 'Particle', [['e', 'Electron'], ['p', 'Proton'], ['a', 'Alpha']]), R('v', 'Speed v', '×10⁶ m/s', 1, 10, 0.5), R('B', 'Flux density B', 'mT', 1, 20, 1), O('fld', 'Field direction', [[-1, 'into page ×'], [1, 'out of page •']])],
  out(p) { const q = PART[p.part], r = q.m * p.v * 1e6 / (p.B / 1e3 * Math.abs(q.q)), T = TAU * q.m / (p.B / 1e3 * Math.abs(q.q)); return [['Force F = BQv', fmt(p.B / 1e3 * Math.abs(q.q) * p.v * 1e6, 'N')], ['Radius r = mv / BQ', len(r)], ['Period T = 2πm / BQ', fmt(T, 's')], ['Frequency f = BQ / 2πm', fmt(1 / T, 'Hz')], ['Charge sign', q.q > 0 ? 'positive' : 'negative']]; },
  key: 'The force is always perpendicular to the velocity, so the speed stays constant and the path is a circle: BQv = mv²/r, giving <b>r = mv/(BQ)</b>. The <b>period T = 2πm/(BQ) does not depend on speed</b>, which is why a cyclotron can use a fixed-frequency electric field to speed particles up on every half-turn while they spiral outwards. Positive and negative charges curve opposite ways (use Fleming’s left hand with conventional current).',
  draw(c, w, h, p, t, dt, S) {

{ code: '3.7.5.3', name: 'Flux linkage', title: 'Magnetic flux and flux linkage', sub: 'Φ = BA cosθ, where θ is the angle between B and the normal to the coil. Links to Required practical 11 (search coil).', h: 420,

{ code: '3.7.5.4', name: 'Induction', title: 'Electromagnetic induction', sub: 'Faraday’s and Lenz’s laws, and the emf of a coil rotating in a field.', h: 560,
