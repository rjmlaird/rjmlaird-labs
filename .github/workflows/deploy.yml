name: Deploy labs

on:
  push:
    branches: [main]
    paths:
      - "packages/astro/**"
      - "packages/biodiversity/**"
      - "packages/carbon-reduction-plan/**"
      - "packages/climate-visualiser/**"
      - "packages/component-sandbox/**"
      - "packages/contrast-lab/**"
      - "packages/drought/**"
      - "packages/equation-scanner/**"
      - "packages/exp-example/**"
      - "packages/graphs/**"
      - "packages/lab-orbital-mechanics/**"
      - "packages/labs-index/**"
      - "packages/mechanics/**"
      - "packages/satellites/**"
      - "packages/sewage/**"
      - "packages/tintwistle/**"
      - "packages/wildfire-story-lab/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to deploy (all = every lab)"
        required: false
        type: choice
        options:
          - all
          - astro
          - biodiversity
          - carbon-reduction-plan
          - climate-visualiser
          - component-sandbox
          - contrast-lab
          - drought
          - equation-scanner
          - exp-example
          - graphs
          - lab-orbital-mechanics
          - labs-index
          - mechanics
          - satellites
          - sewage
          - tintwistle
          - wildfire-story-lab
        default: all

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            astro:
              - 'packages/astro/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            biodiversity:
              - 'packages/biodiversity/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            carbon-reduction-plan:
              - 'packages/carbon-reduction-plan/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            climate-visualiser:
              - 'packages/climate-visualiser/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            component-sandbox:
              - 'packages/component-sandbox/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            contrast-lab:
              - 'packages/contrast-lab/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            drought:
              - 'packages/drought/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            equation-scanner:
              - 'packages/equation-scanner/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            exp-example:
              - 'packages/exp-example/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            graphs:
              - 'packages/graphs/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            lab-orbital-mechanics:
              - 'packages/lab-orbital-mechanics/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            labs-index:
              - 'packages/labs-index/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            mechanics:
              - 'packages/mechanics/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            satellites:
              - 'packages/satellites/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            sewage:
              - 'packages/sewage/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            tintwistle:
              - 'packages/tintwistle/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            wildfire-story-lab:
              - 'packages/wildfire-story-lab/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'

      - name: Resolve package list
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PACKAGE: ${{ inputs.package }}
          CHANGED_ASTRO: ${{ steps.filter.outputs.astro }}
          CHANGED_BIODIVERSITY: ${{ steps.filter.outputs.biodiversity }}
          CHANGED_CARBON: ${{ steps.filter.outputs.carbon-reduction-plan }}
          CHANGED_CLIMATE: ${{ steps.filter.outputs.climate-visualiser }}
          CHANGED_COMPONENT_SANDBOX: ${{ steps.filter.outputs.component-sandbox }}
          CHANGED_CONTRAST: ${{ steps.filter.outputs.contrast-lab }}
          CHANGED_DROUGHT: ${{ steps.filter.outputs.drought }}
          CHANGED_EQUATION: ${{ steps.filter.outputs.equation-scanner }}
          CHANGED_EXP_EXAMPLE: ${{ steps.filter.outputs.exp-example }}
          CHANGED_GRAPHS: ${{ steps.filter.outputs.graphs }}
          CHANGED_ORBITAL: ${{ steps.filter.outputs.lab-orbital-mechanics }}
          CHANGED_LABS_INDEX: ${{ steps.filter.outputs.labs-index }}
          CHANGED_MECHANICS: ${{ steps.filter.outputs.mechanics }}
          CHANGED_SATELLITES: ${{ steps.filter.outputs.satellites }}
          CHANGED_SEWAGE: ${{ steps.filter.outputs.sewage }}
          CHANGED_TINTWISTLE: ${{ steps.filter.outputs.tintwistle }}
          CHANGED_WILDFIRE: ${{ steps.filter.outputs.wildfire-story-lab }}
        run: |
          packages='[]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$DISPATCH_PACKAGE" ] && [ "$DISPATCH_PACKAGE" != "all" ]; then
              packages="[\"$DISPATCH_PACKAGE\"]"
            else
              packages='["astro","biodiversity","carbon-reduction-plan","climate-visualiser","component-sandbox","contrast-lab","drought","equation-scanner","exp-example","graphs","lab-orbital-mechanics","labs-index","mechanics","satellites","sewage","tintwistle","wildfire-story-lab"]'
            fi
          else
            [ "$CHANGED_ASTRO" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["astro"]')
            [ "$CHANGED_BIODIVERSITY" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["biodiversity"]')
            [ "$CHANGED_CARBON" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["carbon-reduction-plan"]')
            [ "$CHANGED_CLIMATE" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["climate-visualiser"]')
            [ "$CHANGED_COMPONENT_SANDBOX" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["component-sandbox"]')
            [ "$CHANGED_CONTRAST" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["contrast-lab"]')
            [ "$CHANGED_DROUGHT" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["drought"]')
            [ "$CHANGED_EQUATION" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["equation-scanner"]')
            [ "$CHANGED_EXP_EXAMPLE" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["exp-example"]')
            [ "$CHANGED_GRAPHS" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["graphs"]')
            [ "$CHANGED_ORBITAL" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["lab-orbital-mechanics"]')
            [ "$CHANGED_LABS_INDEX" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["labs-index"]')
            [ "$CHANGED_MECHANICS" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["mechanics"]')
            [ "$CHANGED_SATELLITES" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["satellites"]')
            [ "$CHANGED_SEWAGE" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["sewage"]')
            [ "$CHANGED_TINTWISTLE" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["tintwistle"]')
            [ "$CHANGED_WILDFIRE" = "true" ] && packages=$(echo "$packages" | jq -c '. + ["wildfire-story-lab"]')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter ./packages/${{ matrix.package }} run build

      - name: Verify output
        run: test -d packages/${{ matrix.package }}/dist

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy packages/${{ matrix.package }}/dist --project-name ${{ matrix.package }}