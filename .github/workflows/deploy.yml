name: Deploy labs

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      package:
        description: "Experiment path under packages/ (for example: contrast), or all"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Discover experiments to deploy
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover deployable experiments
        id: packages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_packages() {
            find packages \
              -type f \
              -name wrangler.jsonc \
              -not -path "*/node_modules/*" \
              -printf "%h\n" \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))' \
              | jq -c '.'
          }

          nearest_deployable_directory() {
            local file="$1"
            local directory

            directory="$(dirname "$file")"

            while [ "$directory" != "." ] && [ "$directory" != "/" ]; do
              if [ -f "$directory/wrangler.jsonc" ]; then
                printf "%s\n" "$directory"
                return 0
              fi

              directory="$(dirname "$directory")"
            done

            return 0
          }

          changed_packages() {
            local changed_files
            local file

            changed_files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")"

            if printf "%s\n" "$changed_files" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/deploy\.yml)$'; then
              echo "Shared dependency or deployment configuration changed; deploying all experiments." >&2
              all_packages
              return 0
            fi

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              nearest_deployable_directory "$file"
            done <<< "$changed_files" \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))' \
              | jq -c '.'
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${REQUESTED_PACKAGE:-}" ] || [ "$REQUESTED_PACKAGE" = "all" ]; then
              echo "Manual deployment of all discovered experiments." >&2
              packages="$(all_packages)"
            else
              requested="packages/${REQUESTED_PACKAGE#packages/}"

              if [ ! -f "$requested/wrangler.jsonc" ]; then
                echo "::error::No deployable experiment exists at '$requested'. Expected '$requested/wrangler.jsonc'."
                exit 1
              fi

              packages="$(jq -cn --arg directory "$requested" '[$directory]')"
            fi
          else
            if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch push detected; deploying all experiments." >&2
              packages="$(all_packages)"
            elif ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              echo "Push base commit is unavailable; deploying all experiments." >&2
              packages="$(all_packages)"
            else
              packages="$(changed_packages)"
            fi
          fi

          packages="$(printf "%s" "$packages" | jq -c '.')"

          echo "Deploy matrix: $packages"
          printf "packages=%s\n" "$packages" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.directory }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify experiment manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.directory }}/package.json" || {
            echo "::error::Missing package.json in '${{ matrix.directory }}'."
            exit 1
          }
          test -f "${{ matrix.directory }}/wrangler.jsonc" || {
            echo "::error::Missing wrangler.jsonc in '${{ matrix.directory }}'."
            exit 1
          }

      - name: Build experiment
        run: pnpm --dir "${{ matrix.directory }}" run build

      - name: Verify static assets
        shell: bash
        run: |
          set -euo pipefail

          test -d "${{ matrix.directory }}/dist" || {
            echo "::error::Expected static build output at '${{ matrix.directory }}/dist'."
            exit 1
          }

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir "${{ matrix.directory }}" exec wrangler deploy
