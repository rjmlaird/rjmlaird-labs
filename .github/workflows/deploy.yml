name: Deploy labs

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      package:
        description: "Experiment directory under packages/ (or all)"
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Discover deployable experiments
        id: packages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          all_packages() {
            find packages \
              -type f \
              -name wrangler.jsonc \
              -not -path '*/node_modules/*' \
              -printf '%h\n' \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))'
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REQUESTED_PACKAGE" = "all" ] || [ -z "$REQUESTED_PACKAGE" ]; then
              packages="$(all_packages)"
            else
              requested="packages/$REQUESTED_PACKAGE"

              if [ ! -f "$requested/wrangler.jsonc" ]; then
                echo "::error::No deployable experiment at $requested. It must contain wrangler.jsonc."
                exit 1
              fi

              packages="$(jq -cn --arg dir "$requested" '[$dir]')"
            fi
          else
            base="${{ github.event.before }}"

            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              packages="$(all_packages)"
            else
              changed_files="$(git diff --name-only "$base" "${{ github.sha }}")"

              if echo "$changed_files" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/deploy\.yml)$'; then
                packages="$(all_packages)"
              else
                packages="$(
                  echo "$changed_files" \
                    | awk -F/ '/^packages\/[^/]+\// { print $1 "/" $2 }' \
                    | sort -u \
                    | while read -r dir; do
                        if [ -f "$dir/wrangler.jsonc" ]; then
                          printf '%s\n' "$dir"
                        fi
                      done \
                    | jq -Rsc 'split("\n") | map(select(length > 0))'
                )"
              fi
            fi
          fi

          echo "Deploy matrix: $packages"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  deploy:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build experiment
        run: pnpm --dir "${{ matrix.directory }}" run build

      - name: Verify static assets
        run: |
          test -d "${{ matrix.directory }}/dist" || {
            echo "::error::Expected ${{ matrix.directory }}/dist after build."
            exit 1
          }

      - name: Deploy Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir "${{ matrix.directory }}" exec wrangler deploy
