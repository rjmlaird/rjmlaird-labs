packages:
  # Shared libraries (brand, and later sim-core, worker-kit, ...)
  - "packages/*"

  # Deployable experiments directly under apps/
  - "apps/*"

  # Nested experiments, for example apps/physics/apps/hub
  - "apps/*/*"

  # Deeper nested experiments, for example apps/leicester/*/*
  - "apps/*/*/*"

  # Exclude generated and dependency directories
  - "!**/node_modules/**"
  - "!**/dist/**"

  # Exclude starter templates from workspace installs/deploy discovery
  - "!**/templates/**"

  # Exclude legacy projects unless you explicitly intend to maintain them
  - "!**/legacy/**"
